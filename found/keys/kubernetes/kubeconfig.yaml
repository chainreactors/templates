id: kubeconfig

info:
  name: Kubernetes Config Credentials
  author: proton
  severity: high
  description: Detects credentials embedded in kubeconfig files — client certificates, private keys, and bearer tokens used for cluster authentication.
  tags: kubernetes,k8s,file,keys,config

file:
  - extensions:
      - yaml
      - yml
      - conf
      - config
      - all

    matchers:
      - type: word
        words:
          - "client-key-data"
          - "client-certificate-data"
          - "certificate-authority-data"
        condition: or

    extractors:
      - type: regex
        regex:
          - 'client-key-data:\s*([A-Za-z0-9+/=]{40,})'
          - 'client-certificate-data:\s*([A-Za-z0-9+/=]{40,})'
          - 'certificate-authority-data:\s*([A-Za-z0-9+/=]{40,})'
