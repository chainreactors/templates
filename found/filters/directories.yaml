# Directories unconditionally skipped at walk level.
# Matched by basename — any directory with this name is skipped regardless of depth.
# .git is intentionally NOT listed — history may contain leaked credentials.

skip:
  # Package managers — dependency directories
  - "node_modules"
  - "bower_components"
  - "vendor"         # Go/PHP/Ruby vendor (third-party code)
  - "site-packages"  # Python installed packages

  # Package manager caches (dotdirs)
  - ".npm"
  - ".yarn"
  - ".pnpm-store"

  # Python
  - "__pycache__"
  - ".tox"
  - ".eggs"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".venv"
  - "venv"
  - ".uv"

  # Go
  - ".goenv"

  # Rust
  - ".cargo"
  - ".rustup"
  - "target"         # Rust build output

  # Ruby
  - ".rbenv"
  - ".gem"
  - ".bundle"

  # Node/JS
  - ".nvm"

  # Java/JVM
  - ".gradle"
  - ".m2"
  - ".ivy2"
  - ".sdkman"

  # .NET
  - ".nuget"

  # PHP
  - ".composer"

  # Elixir/Erlang
  - ".hex"
  - ".mix"

  # Haskell
  - ".stack"
  - ".cabal"

  # OCaml
  - ".opam"

  # Julia
  - ".julia"

  # Dart/Flutter
  - ".pub-cache"
  - ".dartServer"

  # Python (uv, rye, pdm)
  - ".rye"
  - ".pdm-build"

  # Perl
  - ".cpan"

  # Swift/iOS
  - ".swiftpm"
  - "Pods"
  - ".build"        # Swift build output

  # Scala
  - ".sbt"
  - ".bloop"
  - ".metals"

  # C/C++
  - ".conan"
  - "vcpkg_installed"

  # Zig
  - ".zig-cache"

  # Deno / Bun
  - ".deno"
  - ".bun"

  # Conda / Mamba / Pixi
  - ".conda"
  - ".mamba"
  - ".pixi"

  # Android
  - ".android"

  # Lua
  - ".luarocks"

  # Build framework caches
  - ".nx"
  - ".turbo"
  - ".parcel-cache"
  - ".next"

  # Generic caches
  - ".cache"

  # VCS (non-git)
  - ".svn"
  - ".hg"

  # IDE / Editor
  - ".idea"
  - ".vscode"
  - ".eclipse"
  - ".vs"

  # VS Code remote
  - ".vscode-server"

  # Build output
  - ".terraform"
  - ".serverless"

skip_globs:
  # Windows system directories
  - "%APPDATA%/**"
  - "%LOCALAPPDATA%/**"
  - "%USERPROFILE%/AppData/**"

  # Package managers
  - "**/node_modules/"
  - "**/bower_components/"
  - "**/vendor/"
  - "**/site-packages/"

  # Package manager caches
  - "**/npm-cache/"
  - "**/_cacache/"
  - "**/.pnpm-store/"

  # Build artifacts
  - "**/CMakeFiles/"
  - "**/target/"

  # Python
  - "**/__pycache__/"
  - "**/.tox/"
  - "**/.eggs/"
  - "**/.mypy_cache/"
  - "**/.pytest_cache/"
  - "**/.venv/"
  - "**/venv/"
  - "**/.uv/"
  - "**/*.dist-info/"
  - "**/*.egg-info/"

  # Go
  - "**/.goenv/"
  - "**/pkg/mod/"

  # Rust
  - "**/.cargo/"
  - "**/.rustup/"

  # Ruby
  - "**/.rbenv/"
  - "**/.gem/"
  - "**/.bundle/"

  # Node/JS
  - "**/.nvm/"
  - "**/.npm/"
  - "**/.yarn/"

  # Java/JVM
  - "**/.gradle/"
  - "**/.m2/"
  - "**/.ivy2/"
  - "**/.sdkman/"

  # .NET
  - "**/.nuget/"

  # IDE / Editor
  - "**/.idea/"
  - "**/.vscode/"
  - "**/.eclipse/"
  - "**/.vs/"
  - "**/.vscode-server/"

  # VCS (non-git)
  - "**/.svn/"
  - "**/.hg/"

  # Swift/iOS
  - "**/.swiftpm/"
  - "**/Pods/"
  - "**/.build/"

  # Scala
  - "**/.sbt/"
  - "**/.bloop/"
  - "**/.metals/"

  # C/C++
  - "**/.conan/"
  - "**/vcpkg_installed/"

  # Zig
  - "**/.zig-cache/"

  # Deno / Bun
  - "**/.deno/"
  - "**/.bun/"

  # Conda / Mamba / Pixi
  - "**/.conda/"
  - "**/.mamba/"
  - "**/.pixi/"

  # Android
  - "**/.android/"

  # Lua
  - "**/.luarocks/"

  # Build framework caches
  - "**/.nx/"
  - "**/.turbo/"
  - "**/.parcel-cache/"
  - "**/.next/"

  # Generic caches
  - "**/.cache/"

  # Build output
  - "**/.terraform/"
  - "**/.serverless/"

  # System shared docs
  - "**/share/doc/"
  - "**/share/man/"
